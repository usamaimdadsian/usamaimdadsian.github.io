<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>usama@archlinux: ~/portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* ---------------- themes ---------------- */
  :root {
    --mono: 'JetBrains Mono', monospace;
    --bg:#1d1f21; --bg-alt:#25282c; --fg:#c5c8c6; --fg-dim:#969896;
    --red:#cc6666; --green:#b5bd68; --yellow:#f0c674; --blue:#81a2be;
    --purple:#b294bb; --cyan:#8abeb7; --orange:#de935f;
    --border:#373b41; --active-border:#b5bd68;
    --status-bg:#b5bd68; --status-fg:#1d1f21; --status-dim:#3a3f1f;
  }
  [data-theme="dracula"] {
    --bg:#282a36; --bg-alt:#21222c; --fg:#f8f8f2; --fg-dim:#6272a4;
    --red:#ff5555; --green:#50fa7b; --yellow:#f1fa8c; --blue:#8be9fd;
    --purple:#bd93f9; --cyan:#8be9fd; --orange:#ffb86c;
    --border:#44475a; --active-border:#bd93f9;
    --status-bg:#bd93f9; --status-fg:#282a36; --status-dim:#44475a;
  }
  [data-theme="github"] {
    --bg:#0d1117; --bg-alt:#161b22; --fg:#c9d1d9; --fg-dim:#8b949e;
    --red:#ff7b72; --green:#3fb950; --yellow:#d29922; --blue:#58a6ff;
    --purple:#bc8cff; --cyan:#39c5cf; --orange:#ffa657;
    --border:#30363d; --active-border:#58a6ff;
    --status-bg:#238636; --status-fg:#ffffff; --status-dim:#1a4d22;
  }
  [data-theme="matrix"] {
    --bg:#000600; --bg-alt:#020c02; --fg:#36ff6a; --fg-dim:#1f9940;
    --red:#7dff9b; --green:#33ff33; --yellow:#b6ff33; --blue:#33ffb0;
    --purple:#76ffcf; --cyan:#00ffc8; --orange:#9dff33;
    --border:#0f3d1a; --active-border:#33ff33;
    --status-bg:#33ff33; --status-fg:#001400; --status-dim:#0a3d12;
  }
  [data-theme="solarized"] {
    --bg:#fdf6e3; --bg-alt:#eee8d5; --fg:#586e75; --fg-dim:#93a1a1;
    --red:#dc322f; --green:#859900; --yellow:#b58900; --blue:#268bd2;
    --purple:#6c71c4; --cyan:#2aa198; --orange:#cb4b16;
    --border:#ddd6c1; --active-border:#268bd2;
    --status-bg:#586e75; --status-fg:#fdf6e3; --status-dim:#cbd3c0;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--mono); font-size: 14px; line-height: 1.5;
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  #root, .tmux { height: 100%; }
  .tmux { display: flex; flex-direction: column; position: relative; }

  /* ---------------- workarea & panes ---------------- */
  .workarea { flex: 1; min-height: 0; background: var(--border); overflow: hidden; }
  .workarea--tiled {
    display: grid; gap: 1px;
    grid-template-columns: minmax(0,1fr) minmax(0,1fr);
    grid-template-rows: minmax(0,1.0fr) minmax(0,1.1fr) minmax(0,0.85fr);
    grid-template-areas:
      "neofetch about"
      "projects skills"
      "shell shell";
  }
  .workarea--stack { display: flex; flex-direction: column; gap: 1px; }
  .workarea--stack .pane { flex: 1; min-height: 0; }
  .workarea--zoom { display: flex; }
  .workarea--zoom .pane { flex: 1; }

  .pane {
    background: var(--bg); position: relative; min-width: 0; min-height: 0;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .pane--active { box-shadow: inset 0 0 0 1px var(--active-border); }
  .pane__bar {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    padding: 3px 10px; font-size: 11px; letter-spacing: .04em;
    color: var(--fg-dim); border-bottom: 1px solid var(--border);
    background: var(--bg-alt);
  }
  .pane--active .pane__bar { color: var(--active-border); }
  .pane__idx {
    color: var(--status-fg); background: var(--fg-dim); border-radius: 2px;
    padding: 0 5px; font-weight: 700; font-size: 10px;
  }
  .pane--active .pane__idx { background: var(--active-border); }
  .pane__title { text-transform: lowercase; }
  .pane__dots { margin-left: auto; display: flex; gap: 6px; }
  .pane__zoom {
    background: none; border: none; color: inherit; cursor: pointer;
    font-size: 12px; padding: 0 2px; line-height: 1; opacity: .7;
  }
  .pane__zoom:hover { opacity: 1; }
  .pane__body { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px; }

  /* scrollbars */
  .pane__body::-webkit-scrollbar, .pane__body *::-webkit-scrollbar { width: 8px; height: 8px; }
  .pane__body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .pane__body::-webkit-scrollbar-track { background: transparent; }

  .proj-row:hover { background: var(--bg-alt); }
  .social-row:hover { border-color: var(--border) !important; background: var(--bg-alt); }

  /* ---------------- status bar ---------------- */
  .statusbar {
    flex-shrink: 0; height: 24px; display: flex; align-items: stretch;
    justify-content: space-between; background: var(--status-bg);
    color: var(--status-fg); font-size: 12px; font-weight: 500;
    user-select: none;
  }
  .statusbar__left, .statusbar__right { display: flex; align-items: stretch; }
  .sb-session {
    background: rgba(0,0,0,.22); display: flex; align-items: center;
    padding: 0 6px; font-weight: 700;
  }
  .sb-windows { display: flex; align-items: stretch; }
  .sb-win {
    background: none; border: none; color: var(--status-fg); cursor: pointer;
    font: inherit; padding: 0 12px; opacity: .65; display: flex; align-items: center;
  }
  .sb-win:hover { opacity: .9; }
  .sb-win--active {
    opacity: 1; background: rgba(0,0,0,.28); font-weight: 700;
  }
  .statusbar__right > span { display: flex; align-items: center; padding: 0 10px; }
  .sb-host { opacity: .85; }
  .sb-date { background: rgba(0,0,0,.18); }
  .sb-time { background: rgba(0,0,0,.30); font-weight: 700; }

  /* ---------------- CRT effects ---------------- */
  .crt-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
    opacity: 0; transition: opacity .3s;
  }
  [data-crt="subtle"] .crt-overlay { opacity: .35; }
  [data-crt="full"] .crt-overlay {
    opacity: 1;
    background: repeating-linear-gradient(
      to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 1px,
      rgba(0,0,0,.18) 2px, rgba(0,0,0,.18) 3px);
    animation: flicker .14s infinite;
  }
  [data-crt="full"] .crt-overlay::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 120% at 50% 50%, transparent 60%, rgba(0,0,0,.35) 100%);
  }
  [data-crt="subtle"] .pane__body, [data-crt="full"] .pane__body { text-shadow: 0 0 1.5px currentColor; }
  [data-crt="full"] .pane__body { text-shadow: 0 0 2.5px currentColor; }
  @keyframes flicker { 0%{opacity:1} 50%{opacity:.94} 100%{opacity:1} }
  [data-theme="matrix"] .pane__body { text-shadow: 0 0 4px var(--green); }

  @media (prefers-reduced-motion: reduce) {
    [data-crt="full"] .crt-overlay { animation: none; }
  }

  /* responsive: collapse tiled to stack on narrow screens */
  @media (max-width: 760px) {
    .workarea--tiled {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto auto auto;
      grid-template-areas: "neofetch" "about" "projects" "skills" "shell";
      overflow-y: auto;
    }
    .workarea--tiled .pane { min-height: 220px; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="panes.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
